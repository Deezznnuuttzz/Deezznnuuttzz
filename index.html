<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Terrain Contractors — Job Manager</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1c1f26;
    --text-dim: #6b7280;
    --accent: #2f6b4f;
    --accent-dim: #e8f0eb;
    --danger: #b8452f;
    --warn: #c47f17;
    --ok: #2f6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--text);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; color: #aeb4bf; }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
  }
  nav button {
    border: none;
    background: none;
    padding: 12px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat .value.warn { color: var(--warn); }
  .stat .value.ok { color: var(--ok); }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar h2 { margin: 0; font-size: 17px; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.92; }
  button.ghost {
    background: none;
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  button.ghost:hover { background: var(--bg); }
  button.ghost.danger { color: var(--danger); border-color: #edd; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13.5px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  th { background: #fafbfc; color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .badge.active, .badge.paid, .badge.done { background: var(--accent-dim); color: var(--accent); }
  .badge.quoted, .badge.draft, .badge.pending { background: #eef1f5; color: var(--text-dim); }
  .badge.overdue, .badge.over { background: #fbe9e5; color: var(--danger); }
  .badge.sent { background: #fdf2e0; color: var(--warn); }
  .empty { color: var(--text-dim); font-size: 13.5px; padding: 20px; text-align: center; }
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,17,21,0.45);
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
  }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  button.secondary {
    background: none;
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 7px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .line-items { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .line-item-row { display: grid; grid-template-columns: 1fr 60px 90px 30px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .line-item-row input { padding: 6px 8px; font-size: 13px; }
  .row-total { text-align: right; font-weight: 700; font-size: 14px; margin-top: 8px; }
  .job-link { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
  .job-link:hover { text-decoration: underline; }
  .print-only { display: none; }
  @media print {
    header, nav, .toolbar button, .no-print { display: none !important; }
    .print-only { display: block; }
    main { padding: 0; max-width: none; }
    body { background: #fff; }
  }
  ::placeholder { color: #b3b8c2; }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .photo-tile {
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .photo-tile img { width: 100%; height: 110px; object-fit: cover; display: block; background: #eee; }
  .photo-tile-meta { padding: 6px 8px; }
  .photo-tile-job { font-size: 12px; font-weight: 600; }
  .photo-tile-date { font-size: 11px; color: var(--text-dim); }
  .photo-strip { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .photo-strip img { height: 80px; border-radius: 6px; }
  .match-note { font-size: 12.5px; margin-bottom: 10px; }
  .match-note.ok { color: var(--accent); }
  .match-note.warn { color: var(--warn); }
  .gps-row { display: flex; gap: 6px; }
  .gps-row input { flex: 1; }
  .gps-row button { white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div>
    <h1>All Terrain Contractors</h1>
    <div class="sub">Job Manager — data stored locally in this browser</div>
  </div>
  <div class="sub" id="today"></div>
</header>

<nav id="tabs">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="jobs">Jobs</button>
  <button data-tab="clients">Clients</button>
  <button data-tab="vendors">Vendors</button>
  <button data-tab="invoices">Invoices</button>
  <button data-tab="bills">Bills</button>
  <button data-tab="time">Time Tracker</button>
  <button data-tab="tasks">Tasks</button>
  <button data-tab="photos">Photos</button>
  <button data-tab="reports">Reports</button>
</nav>

<main>

  <section id="tab-dashboard" class="section active"></section>
  <section id="tab-jobs" class="section"></section>
  <section id="tab-clients" class="section"></section>
  <section id="tab-vendors" class="section"></section>
  <section id="tab-invoices" class="section"></section>
  <section id="tab-bills" class="section"></section>
  <section id="tab-time" class="section"></section>
  <section id="tab-tasks" class="section"></section>
  <section id="tab-photos" class="section"></section>
  <section id="tab-reports" class="section"></section>

</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="photo-input" accept="image/*" capture="environment" multiple style="display:none">

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'atc_job_manager_v1';

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmtMoney(n) { return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function defaultData() {
    return { clients: [], vendors: [], jobs: [], invoices: [], bills: [], timeEntries: [], tasks: [], catalog: [] };
  }

  let db = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = JSON.parse(raw);
      const d = defaultData();
      Object.keys(d).forEach(k => { if (Array.isArray(parsed[k])) d[k] = parsed[k]; });
      return d;
    } catch (e) {
      console.error('Failed to load data', e);
      return defaultData();
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  // ---------- Photo storage (IndexedDB — photos are too large for localStorage) ----------
  const PHOTO_DB_NAME = 'atc_photos_db';
  const PHOTO_STORE = 'photos';
  let photoDB = null;

  function openPhotoDB() {
    return new Promise((resolve, reject) => {
      if (photoDB) { resolve(photoDB); return; }
      if (!window.indexedDB) { resolve(null); return; }
      const req = indexedDB.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(PHOTO_STORE)) d.createObjectStore(PHOTO_STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => { photoDB = req.result; resolve(photoDB); };
      req.onerror = () => reject(req.error);
    });
  }

  async function addPhotoRecord(photo) {
    const d = await openPhotoDB();
    if (!d) return;
    return new Promise((resolve, reject) => {
      const tx = d.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).put(photo);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getAllPhotoRecords() {
    const d = await openPhotoDB();
    if (!d) return [];
    return new Promise((resolve, reject) => {
      const tx = d.transaction(PHOTO_STORE, 'readonly');
      const req = tx.objectStore(PHOTO_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function deletePhotoRecord(id) {
    const d = await openPhotoDB();
    if (!d) return;
    return new Promise((resolve, reject) => {
      const tx = d.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- Geolocation + job-site matching ----------
  function getCurrentPosition() {
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });
  }

  function haversineMiles(lat1, lng1, lat2, lng2) {
    const R = 3958.8;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function nearestJob(lat, lng) {
    let best = null, bestDist = Infinity;
    db.jobs.forEach(j => {
      if (j.lat == null || j.lng == null) return;
      const dist = haversineMiles(lat, lng, j.lat, j.lng);
      if (dist < bestDist) { bestDist = dist; best = j; }
    });
    return best ? { job: best, distanceMiles: bestDist } : null;
  }

  function fmtDistance(miles) {
    if (miles < 0.19) return Math.round(miles * 5280) + ' ft';
    return miles.toFixed(1) + ' mi';
  }

  // ---------- lookups ----------
  function clientName(id) { const c = db.clients.find(x => x.id === id); return c ? c.name : '—'; }
  function jobName(id) { const j = db.jobs.find(x => x.id === id); return j ? j.name : '—'; }
  function vendorName(id) { const v = db.vendors.find(x => x.id === id); return v ? v.name : '—'; }

  function jobActualCost(jobId) {
    const billTotal = db.bills.filter(b => b.jobId === jobId).reduce((s, b) => s + Number(b.amount || 0), 0);
    const laborTotal = db.timeEntries.filter(t => t.jobId === jobId).reduce((s, t) => s + Number(t.hours || 0) * Number(t.rate || 0), 0);
    return billTotal + laborTotal;
  }

  function jobInvoicedTotal(jobId) {
    return db.invoices.filter(i => i.jobId === jobId).reduce((s, i) => s + lineItemsTotal(i.lineItems), 0);
  }

  function lineItemsTotal(items) {
    return (items || []).reduce((s, li) => s + Number(li.qty || 0) * Number(li.rate || 0), 0);
  }

  function invoiceStatus(inv) {
    if (inv.status === 'paid') return 'paid';
    if (inv.status === 'draft') return 'draft';
    if (inv.dueDate && inv.dueDate < todayStr()) return 'overdue';
    return 'sent';
  }

  // ---------- tabs ----------
  const tabButtons = document.querySelectorAll('#tabs button');
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  function setTab(name) {
    tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    render(name);
  }

  function render(name) {
    if (name === 'dashboard') renderDashboard();
    if (name === 'jobs') renderJobs();
    if (name === 'clients') renderClients();
    if (name === 'vendors') renderVendors();
    if (name === 'invoices') renderInvoices();
    if (name === 'bills') renderBills();
    if (name === 'time') renderTime();
    if (name === 'tasks') renderTasks();
    if (name === 'photos') renderPhotos();
    if (name === 'reports') renderReports();
  }

  function renderAll() {
    const active = document.querySelector('#tabs button.active').dataset.tab;
    render(active);
  }

  // ---------- Dashboard ----------
  function renderDashboard() {
    const activeJobs = db.jobs.filter(j => j.status === 'active').length;
    const unbilled = db.jobs.reduce((s, j) => {
      const invoiced = jobInvoicedTotal(j.id);
      const cost = jobActualCost(j.id);
      return s + Math.max(0, cost - invoiced);
    }, 0);
    const overdueInvoices = db.invoices.filter(i => invoiceStatus(i) === 'overdue').length;
    const pendingTime = db.timeEntries.filter(t => !t.approved).length;
    const openTasks = db.tasks.filter(t => !t.done).length;
    const overdueTasks = db.tasks.filter(t => !t.done && t.dueDate && t.dueDate < todayStr()).length;

    const el = document.getElementById('tab-dashboard');
    el.innerHTML = `
      <div class="toolbar"><h2>Overview</h2></div>
      <div class="cards">
        <div class="stat"><div class="label">Active Jobs</div><div class="value">${activeJobs}</div></div>
        <div class="stat"><div class="label">Unbilled Cost</div><div class="value ${unbilled > 0 ? 'warn' : ''}">${fmtMoney(unbilled)}</div></div>
        <div class="stat"><div class="label">Overdue Invoices</div><div class="value ${overdueInvoices > 0 ? 'warn' : 'ok'}">${overdueInvoices}</div></div>
        <div class="stat"><div class="label">Time Pending Approval</div><div class="value ${pendingTime > 0 ? 'warn' : 'ok'}">${pendingTime}</div></div>
        <div class="stat"><div class="label">Open Tasks</div><div class="value">${openTasks}</div></div>
        <div class="stat"><div class="label">Overdue Tasks</div><div class="value ${overdueTasks > 0 ? 'warn' : 'ok'}">${overdueTasks}</div></div>
      </div>
      <div class="toolbar"><h2>Recent Jobs</h2></div>
      ${jobsTable(db.jobs.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 6), false)}
    `;
  }

  // ---------- Jobs ----------
  function jobsTable(jobs, full) {
    if (!jobs.length) return '<div class="empty">No jobs yet.</div>';
    return `<table><thead><tr>
        <th>Job</th><th>Type</th><th>Client</th><th>Status</th>
        <th class="num">Budget</th><th class="num">Actual Cost</th><th class="num">Invoiced</th>
        ${full ? '<th></th>' : ''}
      </tr></thead><tbody>
      ${jobs.map(j => {
        const cost = jobActualCost(j.id);
        const invoiced = jobInvoicedTotal(j.id);
        const overBudget = j.budget && cost > Number(j.budget);
        return `<tr>
          <td><a class="job-link" data-action="edit-job" data-id="${j.id}">${escapeHtml(j.name)}</a>
            <button class="ghost" style="margin-left:6px;padding:2px 6px;font-size:11px;" data-action="view-job-photos" data-id="${j.id}" title="View photos">📷</button>
          </td>
          <td>${escapeHtml(j.type)}</td>
          <td>${escapeHtml(clientName(j.clientId))}</td>
          <td><span class="badge ${j.status}">${escapeHtml(j.status)}</span></td>
          <td class="num">${j.budget ? fmtMoney(j.budget) : '—'}</td>
          <td class="num"><span class="badge ${overBudget ? 'over' : ''}">${fmtMoney(cost)}</span></td>
          <td class="num">${fmtMoney(invoiced)}</td>
          ${full ? `<td><button class="ghost danger" data-action="delete-job" data-id="${j.id}">Delete</button></td>` : ''}
        </tr>`;
      }).join('')}
      </tbody></table>`;
  }

  function renderJobs() {
    const el = document.getElementById('tab-jobs');
    el.innerHTML = `
      <div class="toolbar"><h2>Jobs</h2><button class="primary" data-action="new-job">+ New Job</button></div>
      ${jobsTable(db.jobs, true)}
    `;
  }

  function jobFormModal(job) {
    const isEdit = !!job;
    job = job || { id: uid(), type: 'contract', status: 'quoted', createdAt: todayStr() };
    const clientOptions = db.clients.map(c => `<option value="${c.id}" ${c.id === job.clientId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
    openModal(`
      <h3>${isEdit ? 'Edit Job' : 'New Job'}</h3>
      <div class="field"><label>Job Name</label><input id="f-name" value="${escapeHtml(job.name || '')}" placeholder="e.g. Smith Deck Rebuild"></div>
      <div class="field"><label>Type</label>
        <select id="f-type">
          <option value="contract" ${job.type === 'contract' ? 'selected' : ''}>Contract job</option>
          <option value="service" ${job.type === 'service' ? 'selected' : ''}>Service job</option>
          <option value="internal" ${job.type === 'internal' ? 'selected' : ''}>Internal project</option>
        </select>
      </div>
      <div class="field"><label>Client</label><select id="f-client"><option value="">— none —</option>${clientOptions}</select></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="quoted" ${job.status === 'quoted' ? 'selected' : ''}>Quoted</option>
          <option value="active" ${job.status === 'active' ? 'selected' : ''}>Active</option>
          <option value="done" ${job.status === 'done' ? 'selected' : ''}>Done</option>
        </select>
      </div>
      <div class="field"><label>Address</label><input id="f-address" value="${escapeHtml(job.address || '')}"></div>
      <div class="field"><label>Job Site GPS <span style="font-weight:400;color:var(--text-dim);">(optional — powers photo auto-sync)</span></label>
        <div class="gps-row">
          <input id="f-lat" type="number" step="any" placeholder="Latitude" value="${job.lat != null ? job.lat : ''}">
          <input id="f-lng" type="number" step="any" placeholder="Longitude" value="${job.lng != null ? job.lng : ''}">
          <button type="button" class="ghost" id="use-my-location">Use My Location</button>
        </div>
      </div>
      <div class="field"><label>Budget ($)</label><input id="f-budget" type="number" step="0.01" value="${job.budget || ''}"></div>
      <div class="field"><label>Notes</label><textarea id="f-notes">${escapeHtml(job.notes || '')}</textarea></div>
      <div class="modal-actions">
        <button class="secondary" data-action="close-modal">Cancel</button>
        <button class="primary" id="save-job">Save Job</button>
      </div>
    `);
    document.getElementById('f-client').value = job.clientId || '';
    document.getElementById('use-my-location').addEventListener('click', async () => {
      const btn = document.getElementById('use-my-location');
      btn.textContent = 'Locating…'; btn.disabled = true;
      const pos = await getCurrentPosition();
      btn.textContent = 'Use My Location'; btn.disabled = false;
      if (pos) {
        document.getElementById('f-lat').value = pos.lat.toFixed(6);
        document.getElementById('f-lng').value = pos.lng.toFixed(6);
      } else {
        alert('Could not get your location. Check location permissions for this page (note: some mobile browsers block location on files opened locally — hosting the page fixes this).');
      }
    });
    document.getElementById('save-job').addEventListener('click', () => {

    const isEdit = !!invoice;

    const jobOptions = db.jobs.map(j => `<option value="${j.id}" ${j.id === invoice.jobId ? 'selected' : ''}>${escapeHtml(j.name)}</option>`).join('');

    function lineItemsHtml() {
      return invoice.lineItems.map((li, idx) => `
        <div class="line-item-row" data-idx="${idx}">
          <input class="li-desc" placeholder="Description" value="${escapeHtml(li.desc)}">
          <input class="li-qty" type="number" step="0.01" placeholder="Qty" value="${li.qty}">

          <button class="ghost danger" data-action="remove-line" data-idx="${idx}">×</button>
        </div>`).join('');
    }

    openModal(`
      <h3>${isEdit ? 'Edit Invoice' : 'New Invoice'}</h3>
      <div class="field"><label>Invoice #</label><input id="f-number" value="${escapeHtml(invoice.number)}"></div>
      <div class="field"><label>Job</label><select id="f-job">${jobOptions}</select></div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${invoice.date}"></div>

      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="draft" ${invoice.status === 'draft' ? 'selected' : ''}>Draft</option>
          <option value="sent" ${invoice.status === 'sent' ? 'selected' : ''}>Sent</option>
          <option value="paid" ${invoice.status === 'paid' ? 'selected' : ''}>Paid</option>

        <button class="secondary" data-action="close-modal">Cancel</button>
        <button class="primary" id="save-invoice">Save Invoice</button>
      </div>
    `);

    function syncLineItemsFromDom() {
      const rows = document.querySelectorAll('#line-items .line-item-row');
      invoice.lineItems = Array.from(rows).map(row => ({
        desc: row.querySelector('.li-desc').value,
        qty: parseFloat(row.querySelector('.li-qty').value) || 0,
        rate: parseFloat(row.querySelector('.li-rate').value) || 0
      }));
      document.getElementById('inv-total').textContent = fmtMoney(lineItemsTotal(invoice.lineItems));
    }

    document.getElementById('line-items').addEventListener('input', syncLineItemsFromDom);
    document.getElementById('line-items').addEventListener('click', e => {
      const btn = e.target.closest('[data-action="remove-line"]');
      if (!btn) return;
      syncLineItemsFromDom();
      invoice.lineItems.splice(parseInt(btn.dataset.idx, 10), 1);
      rerenderLineItems();
    });

    function rerenderLineItems() {
      document.getElementById('line-items').innerHTML = lineItemsHtml();
      document.getElementById('inv-total').textContent = fmtMoney(lineItemsTotal(invoice.lineItems));
    }

    document.querySelector('#modal [data-action="add-line"]').addEventListener('click', () => {
      syncLineItemsFromDom();
      invoice.lineItems.push({ desc: '', qty: 1, rate: 0 });
      rerenderLineItems();
    });

    document.getElementById('save-invoice').addEventListener('click', () => {
      syncLineItemsFromDom();

      if (!isEdit) db.invoices.push(invoice);
      save(); closeModal(); renderAll();
    });
  }

  function printInvoice(inv) {
    const job = db.jobs.find(j => j.id === inv.jobId);

    const rows = inv.lineItems.map(li => `<tr><td>${escapeHtml(li.desc)}</td><td style="text-align:right">${li.qty}</td><td style="text-align:right">${fmtMoney(li.rate)}</td><td style="text-align:right">${fmtMoney(li.qty*li.rate)}</td></tr>`).join('');
    const win = window.open('', '_blank');
    win.document.write(`
      <html><head><title>${escapeHtml(inv.number)}</title>
      <style>
        body{font-family:sans-serif;padding:40px;color:#1c1f26;}

    `);
    win.document.close();

      renderPhotoGrid();
    });
    await renderPhotoGrid();
  }

  async function renderPhotoGrid() {
    const grid = document.getElementById('photo-grid');
    if (!grid) return;
    let photos = await getAllPhotoRecords();
    if (photoJobFilter === 'none') photos = photos.filter(p => !p.jobId);
    else if (photoJobFilter !== 'all') photos = photos.filter(p => p.jobId === photoJobFilter);
    photos.sort((a, b) => (b.takenAt || '').localeCompare(a.takenAt || ''));
    if (!photos.length) { grid.className = 'empty'; grid.innerHTML = 'No photos yet.'; return; }
    grid.className = 'photo-grid';
    grid.innerHTML = photos.map(p => `
      <div class="photo-tile" data-action="view-photo" data-id="${p.id}">
        <img src="${p.dataUrl}" loading="lazy">
        <div class="photo-tile-meta">
          <div class="photo-tile-job">${escapeHtml(jobName(p.jobId) || 'Unassigned')}</div>
          <div class="photo-tile-date">${p.takenAt ? fmtDate(p.takenAt.slice(0, 10)) : ''}</div>
        </div>
      </div>
    `).join('');
  }

  async function handleNewPhotos(files) {
    const pos = await getCurrentPosition();
    const match = pos ? nearestJob(pos.lat, pos.lng) : null;
    const dataUrls = await Promise.all(files.map(readFileAsDataUrl));
    openPhotoUploadModal(dataUrls, pos, match);
  }

  function openPhotoUploadModal(dataUrls, pos, match) {
    const jobOptions = db.jobs.map(j => `<option value="${j.id}">${escapeHtml(j.name)}</option>`).join('');
    const matched = match && match.distanceMiles < 1;
    const matchNote = !pos
      ? '<div class="match-note warn">Location unavailable — select the job manually. (On phones, this page needs to be opened over https or from localhost for location to work — a bare local file is often blocked.)</div>'
      : matched
        ? `<div class="match-note ok">Matched to <strong>${escapeHtml(match.job.name)}</strong> (${fmtDistance(match.distanceMiles)} away)</div>`
        : '<div class="match-note warn">No job site nearby — select manually, or open the job and set its GPS location.</div>';

    openModal(`
      <h3>Add ${dataUrls.length > 1 ? dataUrls.length + ' Photos' : 'Photo'}</h3>
      <div class="photo-strip">${dataUrls.map(u => `<img src="${u}">`).join('')}</div>
      ${matchNote}
      <div class="field"><label>Job</label><select id="f-job"><option value="">— unassigned —</option>${jobOptions}</select></div>
      <div class="field"><label>Taken By</label><input id="f-takenby" placeholder="e.g. Mike R."></div>
      <div class="field"><label>Caption / Notes</label><textarea id="f-caption" placeholder="e.g. Framing complete, north wall"></textarea></div>
      <div class="modal-actions">
        <button class="secondary" data-action="close-modal">Cancel</button>
        <button class="primary" id="save-photos">Save</button>
      </div>
    `);
    if (matched) document.getElementById('f-job').value = match.job.id;

    document.getElementById('save-photos').addEventListener('click', async () => {
      const jobId = document.getElementById('f-job').value || null;
      const takenBy = document.getElementById('f-takenby').value.trim();
      const caption = document.getElementById('f-caption').value.trim();
      const saveBtn = document.getElementById('save-photos');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      for (const dataUrl of dataUrls) {
        await addPhotoRecord({
          id: uid(),
          jobId, takenBy, caption,
          lat: pos ? pos.lat : null,
          lng: pos ? pos.lng : null,
          accuracy: pos ? pos.accuracy : null,
          takenAt: new Date().toISOString(),
          dataUrl
        });
      }
      closeModal();
      if (document.querySelector('#tabs button.active').dataset.tab === 'photos') renderPhotoGrid();
    });
  }

  async function viewPhoto(id) {
    const photos = await getAllPhotoRecords();
    const p = photos.find(x => x.id === id);
    if (!p) return;
    openModal(`
      <img src="${p.dataUrl}" style="width:100%;border-radius:8px;margin-bottom:12px;">
      <div style="font-size:13.5px;color:var(--text-dim);margin-bottom:4px;"><strong>Job:</strong> ${escapeHtml(jobName(p.jobId) || 'Unassigned')}</div>
      <div style="font-size:13.5px;color:var(--text-dim);margin-bottom:4px;"><strong>Taken:</strong> ${p.takenAt ? new Date(p.takenAt).toLocaleString() : ''}${p.takenBy ? ' by ' + escapeHtml(p.takenBy) : ''}</div>
      ${p.lat != null ? `<div style="font-size:13.5px;color:var(--text-dim);margin-bottom:4px;"><strong>Location:</strong> ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>` : ''}
      ${p.caption ? `<div style="font-size:13.5px;margin-bottom:12px;">${escapeHtml(p.caption)}</div>` : ''}
      <div class="modal-actions">
        <button class="secondary" data-action="close-modal">Close</button>
        <button class="ghost danger" data-action="delete-photo" data-id="${p.id}">Delete Photo</button>
      </div>
    `);
  }

  // ---------- Reports ----------
  function renderReports() {
    const el = document.getElementById('tab-reports');
    const rows = db.jobs.map(j => {
      const cost = jobActualCost(j.id);
      const invoiced = jobInvoicedTotal(j.id);
      const margin = invoiced - cost;
      return { job: j, cost, invoiced, margin };
    }).sort((a, b) => b.margin - a.margin);

    const totalInvoiced = rows.reduce((s, r) => s + r.invoiced, 0);
    const totalCost = rows.reduce((s, r) => s + r.cost, 0);

    el.innerHTML = `
      <div class="toolbar"><h2>Job Profitability</h2></div>
      <div class="cards">
        <div class="stat"><div class="label">Total Invoiced</div><div class="value">${fmtMoney(totalInvoiced)}</div></div>
        <div class="stat"><div class="label">Total Cost</div><div class="value">${fmtMoney(totalCost)}</div></div>
        <div class="stat"><div class="label">Net Margin</div><div class="value ${(totalInvoiced-totalCost) < 0 ? 'warn' : 'ok'}">${fmtMoney(totalInvoiced-totalCost)}</div></div>
      </div>
      ${rows.length ? `<table><thead><tr><th>Job</th><th>Status</th><th class="num">Invoiced</th><th class="num">Cost</th><th class="num">Margin</th></tr></thead><tbody>
        ${rows.map(r => `<tr>
          <td>${escapeHtml(r.job.name)}</td>
          <td><span class="badge ${r.job.status}">${escapeHtml(r.job.status)}</span></td>
          <td class="num">${fmtMoney(r.invoiced)}</td>
          <td class="num">${fmtMoney(r.cost)}</td>
          <td class="num"><span class="badge ${r.margin < 0 ? 'over' : 'active'}">${fmtMoney(r.margin)}</span></td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty">No jobs yet.</div>'}
    `;
  }

  // ---------- Modal helpers ----------
  const backdrop = document.getElementById('modal-backdrop');
  function openModal(html) {
    document.getElementById('modal').innerHTML = html;
    backdrop.classList.add('open');
  }
  function closeModal() {
    backdrop.classList.remove('open');
    document.getElementById('modal').innerHTML = '';
  }
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

  // ---------- Global click delegation ----------
  document.body.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    switch (action) {
      case 'close-modal': closeModal(); break;

      case 'new-job': jobFormModal(); break;
      case 'edit-job': jobFormModal(db.jobs.find(j => j.id === id)); break;
      case 'delete-job':
        if (confirm('Delete this job? Related bills, invoices, time entries, and tasks will remain but be unlinked.')) {
          db.jobs = db.jobs.filter(j => j.id !== id);
          save(); renderAll();
        }
        break;

      case 'new-client': clientFormModal(); break;
      case 'edit-client': clientFormModal(db.clients.find(c => c.id === id)); break;
      case 'delete-client':
        if (confirm('Delete this client?')) { db.clients = db.clients.filter(c => c.id !== id); save(); renderAll(); }
        break;

      case 'new-vendor': vendorFormModal(); break;
      case 'edit-vendor': vendorFormModal(db.vendors.find(v => v.id === id)); break;
      case 'delete-vendor':
        if (confirm('Delete this vendor?')) { db.vendors = db.vendors.filter(v => v.id !== id); save(); renderAll(); }
        break;

      case 'new-invoice':
        if (!db.jobs.length) { alert('Create a job first.'); break; }
        invoiceFormModal();
        break;
      case 'edit-invoice': invoiceFormModal(db.invoices.find(i => i.id === id)); break;
      case 'print-invoice': printInvoice(db.invoices.find(i => i.id === id)); break;
      case 'delete-invoice':
        if (confirm('Delete this invoice?')) { db.invoices = db.invoices.filter(i => i.id !== id); save(); renderAll(); }
        break;

      case 'new-bill': billFormModal(); break;
      case 'edit-bill': billFormModal(db.bills.find(b => b.id === id)); break;
      case 'delete-bill':
        if (confirm('Delete this bill?')) { db.bills = db.bills.filter(b => b.id !== id); save(); renderAll(); }
        break;

      case 'new-time':
        if (!db.jobs.length) { alert('Create a job first.'); break; }
        timeFormModal();
        break;
      case 'approve-time': {
        const t = db.timeEntries.find(x => x.id === id);
        if (t) { t.approved = true; save(); renderAll(); }
        break;
      }
      case 'delete-time':
        if (confirm('Delete this time entry?')) { db.timeEntries = db.timeEntries.filter(t => t.id !== id); save(); renderAll(); }
        break;

      case 'new-task': taskFormModal(); break;
      case 'toggle-task': {
        const t = db.tasks.find(x => x.id === id);
        if (t) { t.done = btn.checked; save(); renderAll(); }
        break;
      }
      case 'delete-task':
        if (confirm('Delete this task?')) { db.tasks = db.tasks.filter(t => t.id !== id); save(); renderAll(); }
        break;

      case 'add-photo':
        document.getElementById('photo-input').value = '';
        document.getElementById('photo-input').click();
        break;
      case 'view-photo': viewPhoto(id); break;
      case 'delete-photo':
        if (confirm('Delete this photo?')) {
          deletePhotoRecord(id).then(() => { closeModal(); renderPhotoGrid(); });
        }
        break;
      case 'view-job-photos':
        photoJobFilter = id;
        setTab('photos');
        break;
    }
  });

  document.getElementById('photo-input').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    await handleNewPhotos(files);
  });

  // ---------- init ----------
  document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  renderDashboard();
})();
</script>
</body>
</html>
